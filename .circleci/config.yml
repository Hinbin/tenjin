# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

commands:
  shared_steps:
    steps:
      - checkout

      - run:
          name: Configure bundler
          command: |
            echo 'export BUNDLER_VERSION=$(cat Gemfile.lock | tail -1 | tr -d " ")' >> $BASH_ENV
            source $BASH_ENV
            gem install bundler --version "$BUNDLER_VERSION"
            bundle config set path vendor/bundle
            bundle config set clean true
            bundle config set frozen true
      - restore_cache:
          name: Restore bundle cache
          keys:
            - tenjin-bundle-{{ arch }}-{{ checksum "Gemfile.lock" }}
            - tenjin-bundle-{{ arch }}-
      - run:
          name: bundle install
          command: bundle install --jobs=4 --retry=3
          no_output_timeout: 30m
      - save_cache:
          name: Store bundle cache
          key: tenjin-bundle-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      - run: sudo apt update
      - run: sudo apt-get install -y libvips-dev

      - browser-tools/install_chrome
      - browser-tools/install_chromedriver
      - run:
          command: |
            google-chrome --version
            chromedriver --version
          name: Check install


default_job: &default_job
  working_directory: ~/tenjin

jobs:
  build:
    <<: *default_job
    docker:
      - image: cimg/ruby:3.4.9-browsers
        environment:
          RAILS_ENV: test
    steps:
      - shared_steps
      - run:
          name: run RuboCop
          command: bundle exec rubocop
      - run:
          name: build CSS (dartsass)
          command: bundle exec rails dartsass:build
  test:
    <<: *default_job
    parallelism: 4
    docker:
      - image: cimg/ruby:3.4.9-browsers
        environment:
            PGUSER: root
            PGHOST: 127.0.0.1
            RAILS_ENV: test
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: root

    steps:
      - shared_steps
      - run:
          name: precompile assets
          command: |
            bin/rails assets:precompile

      # Wait for DB
      - run: dockerize -wait tcp://localhost:5432 -timeout 1m

      # Database setup
      - run: bin/rails db:create db:schema:load

      # run tests!
      - run:
          name: run tests
          command: |
            mkdir /tmp/test-results
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | \
              circleci tests split --split-by=timings)"
            bundle exec rspec \
              --format progress \
              --format RspecJunitFormatter \
              --out /tmp/test-results/rspec.xml \
              --format progress \
              $TEST_FILES
      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
      - store_artifacts:
          path: /home/circleci/tenjin/tmp/screenshots/
          destination: browser-screenshots

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
